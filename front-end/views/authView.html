<ng-include src="'/views/headerView.html'"></ng-include>

<div id="login" class="col-sm-4 col-sm-offset-4">
	<div class="well">
		<h3>Login</h3>
		<form id="login-form">
			<div class="form-group">
		    	<input type="email" class="form-control" placeholder="Email" ng-model="auth.email">
		  	</div>
		  	<div class="form-group">
		    	<input type="password" class="form-control" placeholder="Password" ng-model="auth.password">
		  	</div>
		  	<button class="btn btn-primary" ng-click="auth.login()">Login</button>
			<span class="create-account small">
				<a href="/signup">Create a new account</a>
			</span>
		</form>

        <button class="btn btn-block btn-google-plus" ng-click="authenticateSocial('google')">
			<span class="ion-social-googleplus"></span> Sign in with Google
        </button>
        <button class="btn btn-block btn-facebook" ng-click="authenticateSocial('facebook')">
			<span class="ion-social-facebook"></span> Sign in with Facebook
        </button>
	</div>
</div>
