<ng-include src="'/partials/header.html'"></ng-include>

<div id="password-reset" class="col-sm-6 col-sm-offset-3">
	<div class="well">
		<h3>Reset Your Password</h3>
		<p>Please enter your email address to reset your password.</p>
		<form id="password-reset-form">
			<div class="form-group">
		    	<input type="email" id="email" class="form-control" placeholder="Email" ng-model="profile.email">
		    	<span class="form-error">{{ profile.error.error_email }}</span>
		  	</div>

			<p class="form-error">{{ profile.error.error_general }}</p>

		  	<button class="btn btn-primary" ng-click="profile.resetPassword()">Submit</button>
			<a class="btn btn-danger" ui-sref="auth">Cancel</a>
		  	<span ng-if="profile.message.message_general">{{ profile.message.message_general }}</span>
		</form>
	</div>
</div>
