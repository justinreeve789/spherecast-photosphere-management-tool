<div id="media-grid" ng-if="media.items">
	<div class="media-item col-lg-2 col-md-3 col-sm-4 col-xs-6" ng-repeat="item in media.items">
		<div class="media-item-image">
			<a href="{{ item.code }}" target="_blank">
				<img src="/api/thumb/{{ item.code }}" alt="" />
			</a>
		</div>
		<div class="media-item-info">
			<div class="media-item-code">{{ item.code }}</div>
			<div class="media-item-title">{{ item.title }}</div>
			<div class="media-item-edit">
				<a href="#">
					<i class="fa fa-cog fa-2x"></i>
				</a>
			</div>
		</div>
	</div>
	<div class="alert alert-danger" ng-if="user.error">
		<strong>There was an error: </strong> {{user.error.error}}
		<br>Please go back and login again
	</div>
</div>
