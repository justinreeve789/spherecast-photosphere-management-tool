<div class="background-dark"></div>

<div id="edit-sphere-sidebar" class="animated slideInRight">
	<form role="form">
		<div class="form-group">
			<label for="title">Title:</label>
			<input type="text" id="title" class="form-control" value="{{ currentItem.title }}">
		</div>
	
		<div class="form-group">
			<label for="code">Short name:</label>
			<input type="text" id="code" class="form-control" value="{{ currentItem.code }}">
		</div>
	
		<div class="form-group">
			<label for="tags">Tags:</label>
			<input type="text" id="tags" class="form-control" value="{{ currentItem.tags }}">
		</div>
	
		<div class="form-group">
			<label for="title">Mode:</label>
			<input type="text" id="mode" class="form-control">
		</div>
	
		<div class="form-group">
			<label for="title">Public:</label>
			<input type="text" id="public" class="form-control">
		</div>
	</form>
</div>
