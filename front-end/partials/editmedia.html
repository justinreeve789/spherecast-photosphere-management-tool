<div class="background-dark"></div>

<div id="edit-sphere-sidebar" class="animated slideInRight">
	<form role="form">
		<input type="hidden" id="it" ng-model="currentItem.id" value="{{ currentItem.id }}">
		<div class="form-group">
			<label for="title">Title:</label>
			<input type="text" id="title" class="form-control" ng-model="currentItem.title" value="{{ currentItem.title }}">
		</div>

		<div class="form-group">
			<label for="code">Short name:</label>
			<input type="text" id="code" class="form-control" ng-model="currentItem.code" value="{{ currentItem.code }}">
		</div>

		<div class="form-group">
			<label for="tags">Tags:</label>
			<input type="text" id="tags" class="form-control" ng-model="currentItem.tags" value="{{ currentItem.tags }}">
		</div>
<!--
		<div class="form-group">
			<label for="title">Mode:</label>
			<input type="text" id="mode" class="form-control">
		</div>

		<div class="form-group">
			<label for="title">Public:</label>
			<input type="text" id="public" class="form-control">
		</div>
-->
		<div class="form-group">
			<button class="btn btn-primary" ng-click="save(currentItem)">
				<i class="fa fa-floppy-o fa-fw" ng-if="!formSaving"></i>
				<i class="fa fa-spinner fa-pulse fa-fw" ng-if="formSaving"></i>
				Save
			</button>
			<button class="btn btn-warning" ng-click="cancel(currentItem)">Cancel</button>
			<button class="btn btn-danger pull-right" ng-click="delete(currentItem)"><i class="fa fa-trash-o"></i></button>
		</div>
	</form>
</div>
